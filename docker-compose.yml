services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    ports:
      - '${POSTGRES_PORT:?POSTGRES_PORT is not set in .env}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
